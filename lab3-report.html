    <h2>一、实验内容</h2>
    <p>识别代码坏味道，度量圈复杂度，拆分上帝函数，使用策略模式消除 if-else，实现架构分层与服务下沉。</p>

    <h2>二、遇到的问题</h2>
    <ul>
        <li>函数职责过多，难以维护</li>
        <li>大量 if-else 导致扩展性差</li>
        <li>业务逻辑与控制器耦合</li>
    </ul>

    <h2>三、经验教训</h2>
    <p>单一职责、关注点分离、策略模式能大幅提升可维护性，增量重构保证功能不变的前提下优化架构。</p>
